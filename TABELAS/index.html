<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=,, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <h1> Catálogo de Roupas</h1>

    <table>
        <tbody>
            <!--Essa é a tag da tabela propriamente dita, que contém todas as linhas e colunas da tabela.-->

            <tr> <!--tr=> table row, ou seja, linha da tabela.-->
                <th>Produtos</th> <!--th=> table header, ou seja, cabeçalho da tabela.-->
                <th>Cor</th>
                <th>Tamanho</th>
                <th>Preço</th>
                <th>Disponibilidade</th>
            </tr>

            <tr>
                <td>Camiseta</td> <!--td=> table data, ou seja, célula da tabela.-->
                <td>Preta</td>
                <td>M</td>
                <td>R$ 29,90</td>
                <td>Sim</td>
            </tr>

            <tr>
                <td>Calça Jeans</td>
                <td>Azul</td>
                <td>G</td>
                <td>R$ 79,90</td>
                <td>Não</td>
            </tr>
            
        </tbody>
</body>

</html>
